name: Release Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y neovim
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - run: nvim --headless -u NONE -n -l tests/lua/mdlive_spec.lua
        env:
          NVIM_LOG_FILE: /tmp/mdlpv-nvim.log

  package:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mdlpv-rs
            archive: mdlpv-rs-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: mdlpv-rs
            archive: mdlpv-rs-linux-aarch64.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: mdlpv-rs
            archive: mdlpv-rs-macos-x86_64.tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            binary: mdlpv-rs
            archive: mdlpv-rs-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mdlpv-rs.exe
            archive: mdlpv-rs-windows-x86_64.zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: mdlpv-rs.exe
            archive: mdlpv-rs-windows-aarch64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Stage package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/mdlpv-rs
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/mdlpv-rs/
          cp -R lua plugin assets docs dist/mdlpv-rs/
          cp README.md LICENSE THIRD_PARTY_NOTICES.md dist/mdlpv-rs/
      - name: Create archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [[ "${{ matrix.archive }}" == *.zip ]]; then
            7z a "${{ matrix.archive }}" mdlpv-rs
          else
            tar -czf "${{ matrix.archive }}" mdlpv-rs
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum mdlpv-rs-* > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/mdlpv-rs-*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* --title "${GITHUB_REF_NAME}" --generate-notes
          fi
