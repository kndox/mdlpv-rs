name: Release Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mdlpv-rs
            archive: mdlpv-rs-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: mdlpv-rs
            archive: mdlpv-rs-linux-aarch64.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: mdlpv-rs
            archive: mdlpv-rs-macos-x86_64.tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            binary: mdlpv-rs
            archive: mdlpv-rs-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mdlpv-rs.exe
            archive: mdlpv-rs-windows-x86_64.zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: mdlpv-rs.exe
            archive: mdlpv-rs-windows-aarch64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Stage package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/mdlpv-rs
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/mdlpv-rs/
          cp -R lua plugin assets docs dist/mdlpv-rs/
          cp README.md LICENSE THIRD_PARTY_NOTICES.md dist/mdlpv-rs/
      - name: Create archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [[ "${{ matrix.archive }}" == *.zip ]]; then
            7z a "${{ matrix.archive }}" mdlpv-rs
          else
            tar -czf "${{ matrix.archive }}" mdlpv-rs
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum mdlpv-rs-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* --title "${GITHUB_REF_NAME}" --generate-notes
          fi
