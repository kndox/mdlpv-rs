[package]
name = "mdlpv-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Neovim Markdown live preview powered by a small Rust localhost server"
license = "MIT"
repository = "https://github.com/kndox/mdlpv-rs"
readme = "README.md"

[dependencies]
anyhow = "1"
ammonia = "4.1.2"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
cssparser = "0.35"
futures-util = "0.3"
merman = "0.9.2"
pulldown-cmark = "0.13"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = "0.5"
