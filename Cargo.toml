[package]
name = "mdlpv-rs"
version = "0.3.0"
edition = "2024"
description = "Neovim Markdown live preview powered by a small Rust localhost server"
license = "MIT"
repository = "https://github.com/kndox/mdlpv-rs"
readme = "README.md"

[dependencies]
anyhow = "1"
ammonia = "4.2.5"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
cssparser = "0.35"
futures-util = "0.3"
# The optional `math` feature (RaTeX) stays disabled: it depends on the unmaintained
# ttf-parser. See docs/release.md#upstream-tracking before enabling it.
merman = "0.11.0"
pulldown-cmark = "0.13.6"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = "0.5"
